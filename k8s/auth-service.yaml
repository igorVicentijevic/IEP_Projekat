apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      initContainers:

        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - >
              until nc -z auth-db 5432; do
                echo "Cekam auth-db...";
                sleep 2;
              done

        - name: init-db
          image: auth-service:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "init_db.py"]
          envFrom:
            - configMapRef:
                name: fond-config
            - secretRef:
                name: fond-secrets
      containers:
        - name: auth-service
          image: auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
          envFrom:
            - configMapRef:
                name: fond-config
            - secretRef:
                name: fond-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector:
    app: auth-service
  ports:
    - port: 5001
      targetPort: 5001
