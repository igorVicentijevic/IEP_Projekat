apiVersion: apps/v1
kind: Deployment
metadata:
  name: director-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: director-service
  template:
    metadata:
      labels:
        app: director-service
    spec:
      initContainers:
        - name: wait-for-mongo
          image: busybox:1.36
          command:
            - sh
            - -c
            - >
              until nc -z mongo-db 27017; do
                echo "Cekam mongo-db...";
                sleep 2;
              done
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - >
              until nc -z redis-service 6379; do
                echo "Cekam redis-service...";
                sleep 2;
              done
      containers:
        - name: director-service
          image: director-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5003
          envFrom:
            - configMapRef:
                name: fond-config
            - secretRef:
                name: fond-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: director-service
spec:
  selector:
    app: director-service
  ports:
    - port: 5003
      targetPort: 5003
