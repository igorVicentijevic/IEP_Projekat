apiVersion: v1
kind: ConfigMap
metadata:
  name: fond-config
data:
  # Postgres (auth-service)
  POSTGRES_HOST: auth-db
  POSTGRES_PORT: "5432"
  POSTGRES_DB: auth_db

  # MongoDB (director-service, employee-service)
  MONGO_HOST: mongo-db
  MONGO_PORT: "27017"
  MONGO_DB_NAME: fond_db

  # Redis (director-service, employee-service)
  REDIS_HOST: redis-service
  REDIS_PORT: "6379"
