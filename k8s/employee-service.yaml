apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-service
spec:
  # Spec eksplicitno traži 3 replike ovog servisa zbog dostupnosti i paralelne obrade
  replicas: 3
  selector:
    matchLabels:
      app: employee-service
  template:
    metadata:
      labels:
        app: employee-service
    spec:
      initContainers:
        - name: wait-for-mongo
          image: busybox:1.36
          command:
            - sh
            - -c
            - >
              until nc -z mongo-db 27017; do
                echo "Cekam mongo-db...";
                sleep 2;
              done
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - >
              until nc -z redis-service 6379; do
                echo "Cekam redis-service...";
                sleep 2;
              done
      containers:
        - name: employee-service
          image: employee-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5002
          envFrom:
            - configMapRef:
                name: fond-config
            - secretRef:
                name: fond-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: employee-service
spec:
  selector:
    app: employee-service
  ports:
    - port: 5002
      targetPort: 5002
